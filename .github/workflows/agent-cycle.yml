# Runs one Threadweaver cycle about every 3 hours on GitHub's servers.
#
# Since HW4 the cycle is the Game Odds Lab services agent (python -m oddslab):
# it offers a service on the HW4 Agent Services Forum, answers requests, and
# hires another agent. The HW3 forum agent (python -m agent) stays in the repo
# but is no longer scheduled.
#
# GitHub's scheduler often delays or drops scheduled runs, so it is asked to
# start the workflow five times an hour and the agent skips any scheduled start that
# comes less than 2.5 hours after its last real cycle. Manual runs are never skipped.
#
# Backup timer: an external cron service (cron-job.org) calls the GitHub API
# hourly to dispatch this workflow with mode=auto, which applies the same 2.5h
# gap. Whichever trigger fires first runs the cycle; the others skip.
#
# Persistent memory: state/ (SQLite) and logs/ are restored from the Actions
# cache at the start of each run and saved again at the end, even if the run
# failed or crashed, so the agent remembers across runs and can reconcile
# interrupted writes.
#
# Secrets: add CANVAS_TOKEN and ANTHROPIC_API_KEY under
# Settings → Secrets and variables → Actions. They are never written to disk.

name: agent-cycle
# GitHub shows API-dispatched runs as "Manually run by <token owner>", including
# the hourly timer's. The run title says what actually started each run.
run-name: "${{ github.event_name == 'schedule' && 'Scheduled (GitHub cron)' || inputs.mode == 'auto' && 'Timer (hourly, cron-job.org)' || format('Manual: {0}', inputs.mode) }}"

on:
  schedule:
    # Five chances per hour: GitHub silently drops many scheduled starts, so
    # several entries raise the odds that at least one fires. The agent skips
    # any scheduled start within 2.5h of its last real cycle.
    - cron: "7 * * * *"
    - cron: "19 * * * *"
    - cron: "31 * * * *"
    - cron: "43 * * * *"
    - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: run
        options: [run, auto, dry-run, check, status, reset]

# Never run two cycles at once: they would race on the cached memory.
concurrency:
  group: agent-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_NAME: ${{ vars.AGENT_NAME || 'Threadweaver' }}
      MODE: ${{ inputs.mode || 'run' }}
      # "0" until a dry run against the real forum has been reviewed: run/auto then do nothing.
      HW4_LIVE: "0"
      AGENT_TRIGGER: >-
        ${{ github.event_name == 'schedule' && 'github-schedule'
        || inputs.mode == 'auto' && 'timer'
        || format('manual-{0}', inputs.mode) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore agent memory
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            logs
          key: agent-memory-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: agent-memory-

      - name: Run agent
        run: |
          if [ "$HW4_LIVE" != "1" ] && { [ "$MODE" = run ] || [ "$MODE" = auto ]; }; then
            echo "HW4 agent not live yet (HW4_LIVE=0); only dry-run/check/status are enabled."
            exit 0
          fi
          case "$MODE" in
            run)
              if [ "${{ github.event_name }}" = "schedule" ]; then
                python -m oddslab run --min-gap-hours 2.5
              else
                python -m oddslab run
              fi ;;
            auto)    python -m oddslab run --min-gap-hours 2.5 ;;  # used by the external timer
            dry-run) python -m oddslab run --dry-run ;;
            check)   python -m oddslab check ;;
            status)  python -m oddslab status ;;
            reset)   python -m oddslab reset ;;
          esac

      - name: Save agent memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            logs
          key: agent-memory-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run summary
        if: always()
        run: |
          {
            echo '```'
            python -m oddslab status || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python -m oddslab evidence > evidence.md || true

      - name: Upload logs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/hw4/agent.jsonl
            evidence.md
          if-no-files-found: ignore
          retention-days: 30
